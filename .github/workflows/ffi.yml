name: emacs-ffi

on: [push]


jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v4

    - name: Install packages
      run: sudo apt-get update && sudo apt-get install -y emacs libltdl7 libltdl-dev libffi-dev libgsl-dev texinfo

    - name: About Emacs
      run: make emacs-info

    - name: Run ffi tests
      run: |
        make all
        make check

    - name: Run gsl-ffi.el
      run: |
        make gsl

    - name: Run gsl-ffi.org
      run: |
        make gsl-org
